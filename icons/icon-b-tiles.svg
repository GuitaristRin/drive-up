<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#1A1A1A"/>

  <!-- Metro tile grid: 3 columns × 4 rows, offset layout -->
  <!-- Gap: 8px between tiles -->

  <!-- Column 1  x=48 -->
  <rect x="48"  y="48"  width="136" height="100" fill="#0078D7"/>
  <rect x="48"  y="156" width="136" height="100" fill="#2EBD6B"/>
  <rect x="48"  y="264" width="136" height="100" fill="#E04F5F"/>
  <rect x="48"  y="372" width="136" height="92"  fill="#8B5CF6"/>

  <!-- Column 2  x=192 -->
  <rect x="192" y="48"  width="136" height="208" fill="#F4C430"/>
  <rect x="192" y="264" width="136" height="100" fill="#00A8CC"/>
  <rect x="192" y="372" width="136" height="92"  fill="#E8720C"/>

  <!-- Column 3  x=336 -->
  <rect x="336" y="48"  width="128" height="100" fill="#D63384"/>
  <rect x="336" y="156" width="128" height="208" fill="#0078D7" fill-opacity="0.75"/>
  <rect x="336" y="372" width="128" height="92"  fill="#3DAA70"/>

  <!-- Up arrow overlay — bottom-right corner -->
  <polygon points="384,440 424,380 464,440" fill="white" fill-opacity="0.15"/>
  <rect x="415" y="380" width="18" height="84" fill="white" fill-opacity="0.15"/>
</svg>
