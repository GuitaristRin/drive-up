<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0078D7"/>

  <!-- Ascending step bars — "Drive Up" as progress -->
  <!-- Bar 1 (shortest, leftmost) -->
  <rect x="56"  y="360" width="88" height="96" fill="white"/>

  <!-- Bar 2 -->
  <rect x="160" y="272" width="88" height="184" fill="white"/>

  <!-- Bar 3 -->
  <rect x="264" y="184" width="88" height="272" fill="white"/>

  <!-- Bar 4 (tallest, rightmost) — accent color -->
  <rect x="368" y="88"  width="88" height="368" fill="#F4C430"/>

  <!-- Arrow head pointing up on the tallest bar -->
  <polygon points="368,88  456,88  412,32" fill="#F4C430"/>

  <!-- Thin bottom baseline -->
  <rect x="48" y="456" width="416" height="4" fill="white" fill-opacity="0.4"/>

  <!-- Small tick marks on y-axis suggestion -->
  <rect x="40" y="360" width="12" height="3" fill="white" fill-opacity="0.5"/>
  <rect x="40" y="272" width="12" height="3" fill="white" fill-opacity="0.5"/>
  <rect x="40" y="184" width="12" height="3" fill="white" fill-opacity="0.5"/>
  <rect x="40" y="96"  width="12" height="3" fill="white" fill-opacity="0.5"/>
</svg>
