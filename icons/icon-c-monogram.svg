<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark navy -->
  <rect width="512" height="512" fill="#0F1923"/>

  <!-- Blue left-side bar — the vertical spine of "D" -->
  <rect x="96" y="88" width="56" height="336" fill="#0078D7"/>

  <!-- "D" curve: three horizontal bars extending right then tapering -->
  <!-- Top bar -->
  <rect x="96" y="88" width="228" height="56" fill="#0078D7"/>
  <!-- Middle bar (wider) -->
  <rect x="96" y="228" width="280" height="56" fill="#0078D7"/>
  <!-- Bottom bar -->
  <rect x="96" y="368" width="228" height="56" fill="#0078D7"/>

  <!-- Right curve fill — rounded right side of D -->
  <!-- Achieved with three rectangles forming a stepped curve -->
  <rect x="268" y="88"  width="56" height="56" fill="#0078D7"/>
  <rect x="316" y="144" width="56" height="56" fill="#0078D7"/>
  <rect x="348" y="200" width="28" height="112" fill="#0078D7"/>
  <rect x="316" y="312" width="56" height="56" fill="#0078D7"/>
  <rect x="268" y="368" width="56" height="56" fill="#0078D7"/>

  <!-- UP ARROW — top right corner, accent color -->
  <!-- Arrow head -->
  <polygon points="376,136  424,136  400,88" fill="#F4C430"/>
  <!-- Arrow shaft -->
  <rect x="388" y="136" width="24" height="92" fill="#F4C430"/>

  <!-- Subtle grid dots at bottom-left -->
  <rect x="48"  y="448" width="12" height="12" fill="#0078D7" fill-opacity="0.5"/>
  <rect x="72"  y="448" width="12" height="12" fill="#0078D7" fill-opacity="0.5"/>
  <rect x="96"  y="448" width="12" height="12" fill="#0078D7" fill-opacity="0.5"/>
  <rect x="48"  y="472" width="12" height="12" fill="#0078D7" fill-opacity="0.3"/>
  <rect x="72"  y="472" width="12" height="12" fill="#0078D7" fill-opacity="0.3"/>
  <rect x="96"  y="472" width="12" height="12" fill="#0078D7" fill-opacity="0.3"/>
</svg>
